name: Desktop builds

# Builds the installer and portable executable. Every push to main uploads them
# as workflow artifacts; a tag like v0.1.0 also publishes a GitHub release, which
# is what the library itself reads to offer updates.
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - name: Build Windows installer and portable exe
        run: npm run dist:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: Generator-Library-Windows
          path: |
            dist/Generator-Library-Setup-*.exe
            dist/Generator-Library-Portable-*.exe
          if-no-files-found: error
          retention-days: 30
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/Generator-Library-Setup-*.exe
            dist/Generator-Library-Portable-*.exe
          fail_on_unmatched_files: true
          generate_release_notes: true

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Build AppImage
        run: npm run dist:linux
      - uses: actions/upload-artifact@v4
        with:
          name: Generator-Library-Linux
          path: dist/*.AppImage
          if-no-files-found: error
          retention-days: 30
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.AppImage
          fail_on_unmatched_files: true
