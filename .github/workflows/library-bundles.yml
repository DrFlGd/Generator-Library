name: Library bundles

# Offline builds of apps whose build needs more than Node.js (git, zip, pnpm,
# a whole site of apps), so the library cannot build them on the user's
# computer. Each new upstream commit becomes a pre-release here, tagged
# `<id>-<commit>` with one `<id>-web-<commit>.zip`, which the catalog installs.
# Pre-releases never show as this repository's latest release, and only the
# newest few per app are kept.
on:
  schedule:
    - cron: '15 6 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: Rebuild even if a release for the upstream commit exists
        type: boolean
        default: false
  pull_request:
    paths:
      - .github/workflows/library-bundles.yml
      - .github/workflows/library-bundle.yml
      - scripts/bundles/**

permissions:
  contents: read

concurrency:
  group: library-bundles-${{ github.ref }}
  cancel-in-progress: false

jobs:
  openscad-playground:
    uses: ./.github/workflows/library-bundle.yml
    permissions:
      contents: write
    with:
      id: openscad-playground
      name: OpenSCAD Playground
      upstream: openscad/openscad-playground
      node: '22'
      force: ${{ inputs.force == true }}

  vostok-labs-original:
    uses: ./.github/workflows/library-bundle.yml
    permissions:
      contents: write
    with:
      id: vostok-labs-original
      name: Vostok Labs (original site)
      upstream: vostoklabs/vostoklabs.github.io
      node: '22'
      force: ${{ inputs.force == true }}
